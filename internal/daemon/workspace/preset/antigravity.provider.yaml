apiVersion: warp/v1alpha1
kind: ModelProvider
metadata:
  name: antigravity
spec:
  type: antigravity
  endpoint: https://daily-cloudcode-pa.googleapis.com
  defaultModels:
    completion: gemini-4-hydrogen
  auth:
    type: oauth2
    env: ANTIGRAVITY_TOKEN
  models:
    - id: gemini-4-hydrogen
      name: gemini-4-hydrogen
      label: Gemini 4 Hydrogen
      limits:
        context: 1048576
        output: 65536
      capabilities:
        tools: true
        temperature: true
        thinking:
          - type: effort
            default: high
            isDefault: true
            allowedEfforts:
              - low
              - medium
              - high
              - xhigh
    - id: gemini-4-carbon
      name: gemini-4-carbon
      label: Gemini 4 Carbon
      limits:
        context: 1048576
        output: 65536
      capabilities:
        tools: true
        temperature: true
        thinking:
          - type: effort
            default: high
            isDefault: true
            allowedEfforts:
              - low
              - medium
              - high
    - id: gemini-4-argon
      name: gemini-4-argon
      label: Gemini 4 Argon
      limits:
        context: 1048576
        output: 65536
      capabilities:
        tools: true
        temperature: true
        thinking:
          - type: effort
            default: high
            isDefault: true
            allowedEfforts:
              - low
              - medium
              - high
    - id: gemini-3.8-flash
      name: gemini-3.8-flash
      label: Gemini 3.8 Flash
      limits:
        context: 1048576
        output: 65536
      capabilities:
        tools: true
        temperature: true
        thinking:
          - type: effort
            default: high
            isDefault: true
            allowedEfforts:
              - low
              - medium
              - high
