apiVersion: warp/v1alpha1
kind: ModelProvider
metadata:
  name: antigravity
spec:
  type: antigravity
  endpoint: https://daily-cloudcode-pa.googleapis.com
  defaultModels:
    completion: gemini-4-neon
  auth:
    type: oauth2
  models:
    - id: gemini-4-neon
      name: gemini-4-neon
      label: Gemini 4 Neon
      aliases: [smart, agy-neon]
      limits:
        context: 1048576
        output: 65536
      capabilities:
        tools: true
        temperature: true
        thinking:
          - type: effort
            default: high
            isDefault: true
            allowedEfforts:
              - low
              - medium
              - high
              - xhigh
    - id: gemini-4-hydrogen
      name: gemini-4-hydrogen
      label: Gemini 4 Hydrogen
