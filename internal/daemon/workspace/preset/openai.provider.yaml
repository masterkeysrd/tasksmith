apiVersion: warp/v1alpha1
kind: ModelProvider
metadata:
  name: openai
spec:
  type: openai
  endpoint: https://api.openai.com/v1
  defaultModel: gpt-5.5
  config:
    # apiMode: responses | chat_completions (omitted = auto-detect per model)
    # store: false disables server-side conversation state retention (ZDR mode)
    store: false
  auth:
    type: env
    env: OPENAI_API_KEY
  models:
    - id: gpt-5.4
      name: gpt-5.4
      label: GPT-5.4
      limits:
        context: 1050000
        output: 128000
    - id: gpt-5.5
      name: gpt-5.5
      label: GPT-5.5
      limits:
        context: 1050000
        output: 128000
    - id: gpt-5.5-pro
      name: gpt-5.5-pro
      label: GPT-5.5 Pro
      limits:
        context: 1050000
        output: 128000
    - id: gpt-5-codex
      name: gpt-5-codex
      label: GPT-5 Codex
      limits:
        context: 1050000
        output: 128000
    - id: gpt-5.2-codex
      name: gpt-5.2-codex
      label: GPT-5.2 Codex
      limits:
        context: 1050000
        output: 128000
    - id: gpt-5.3-codex
      name: gpt-5.3-codex
      label: GPT-5.3 Codex
      limits:
        context: 1050000
        output: 128000
    - id: o3
      name: o3
      label: o3
      limits:
        context: 200000
        output: 100000
    - id: o3-mini
      name: o3-mini
      label: o3-mini
      limits:
        context: 200000
        output: 100000
