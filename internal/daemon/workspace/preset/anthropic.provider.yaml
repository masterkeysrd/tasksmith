apiVersion: warp/v1alpha1
kind: ModelProvider
metadata:
  name: anthropic
spec:
  type: anthropic
  endpoint: https://api.anthropic.com
  defaultModel: claude-sonnet-5
  auth:
    type: env
    env: ANTHROPIC_API_KEY
  models:
    - id: claude-haiku-4-5
      name: claude-haiku-4-5
      label: Claude 4.5 Haiku
      limits:
        context: 200000
        output: 64000
    - id: claude-sonnet-5
      name: claude-sonnet-5
      label: Claude 5 Sonnet
      limits:
        context: 1000000
        output: 128000
    - id: claude-opus-5
      name: claude-opus-5
      label: Claude 5 Opus
      limits:
        context: 1000000
        output: 128000
    - id: claude-fable-5-1
      name: claude-fable-5-1
      label: Claude 5.1 Fable
      limits:
        context: 1000000
        output: 128000
