apiVersion: warp/v1alpha1
kind: ModelProvider
metadata:
  name: ollama
spec:
  type: ollama
  endpoint: http://localhost:11434
  defaultModels:
    completion: qwen3.8
    decision: nimble-v3
  models:
    - id: nimble-v3
      name: nimble-v3
      label: Nimble v3 Decision
      limits:
        context: 32768
      capabilities:
        completion: false
        decision: true
    - id: qwen3.8
      name: qwen3.8
      label: Qwen 3.8
      aliases: [flagship, smart, balanced, fast]
      limits:
        context: 262144
        output: 32768
    - id: mimo-v2.6
      name: mimo-v2.6
      label: MiMo v2.6
      limits:
        context: 262144
        output: 32768
    - id: qwen3.8-flash-next
      name: qwen3.8-flash-next
      label: Qwen 3.8 Flash Next
      limits:
        context: 262144
        output: 32768
    - id: nemotron-3.5-lightning
      name: nemotron-3.5-lightning
      label: Nemotron 3.5 Lightning
      limits:
        context: 262144
        output: 32768
