# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: tasksmith

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/tasksmith/
    env:
      - CGO_ENABLED=0
    # Windows is unsupported: the daemon relies on POSIX process groups and
    # flock (internal/core/sys, internal/daemon/sandbox/proc.go).
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/masterkeysrd/tasksmith/internal/version.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: tasksmith
    binaries:
      - tasksmith
    directory: Casks
    homepage: "https://github.com/masterkeysrd/tasksmith"
    description: "Provider-agnostic coding agents. Deterministic environments. Kernel-sandboxed AI coding CLI and daemon."
    license: "Apache-2.0"
    skip_upload: auto
    commit_msg_template: "chore(brew): update {{ .ProjectName }} cask for {{ .Tag }}"
    repository:
      owner: masterkeysrd
      name: tasksmith
      branch: main
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tasksmith"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(brew\\):"

release:
  mode: keep-existing
  extra_files:
    - glob: ./scripts/install.sh
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
