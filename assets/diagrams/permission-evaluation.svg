<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" width="920" height="424" role="img" aria-label="TaskSmith permission evaluation waterfall: Workspace and agent policies, deny rules, trust and safety, allow rules and session mode, and remaining prompts">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .kicker { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #8b949e; }
      .title { font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .sub { font-size: 11px; fill: #9198a1; }
      .edge { font-size: 10px; font-weight: 600; fill: #8b949e; }
    </style>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 1.5 1.5 L 8.5 1.5 L 5 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="right-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#ff7b72" />
    </marker>
    <marker id="right-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="right-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="0">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#f0883e" />
    </marker>
  </defs>

  <!-- Outer card frame -->
  <rect x="1" y="1" width="918" height="422" rx="14" fill="#0b0f14" stroke="#30363d" stroke-width="1.5" />

  <text x="28" y="32" class="sans kicker">PERMISSION EVALUATION ORDER (DENY &gt; ALLOW &gt; ASK)</text>
  <text x="708" y="32" class="sans kicker">OUTCOME</text>

  <!-- Stage 1 -->
  <rect x="28" y="46" width="532" height="56" rx="9" fill="#0d1117" stroke="#ff7b72" stroke-opacity="0.65" stroke-width="1.2" />
  <rect x="28" y="46" width="4" height="56" rx="2" fill="#ff7b72" />
  <text x="46" y="70" class="sans title">1. Workspace &amp; active-agent policies</text>
  <text x="46" y="88" class="sans sub">Excluded or denied tools stop immediately; agents can only narrow policies.</text>
  <line x1="560" y1="74" x2="700" y2="74" stroke="#ff7b72" stroke-width="1.4" marker-end="url(#right-red)" />
  <text x="630" y="66" text-anchor="middle" class="sans edge">Excluded / denied</text>
  <rect x="708" y="54" width="184" height="40" rx="8" fill="#2c161a" stroke="#ff7b72" stroke-opacity="0.7" stroke-width="1.1" />
  <text x="800" y="78" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ff7b72">Block (no prompt)</text>

  <line x1="294" y1="102" x2="294" y2="117" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#down)" />

  <!-- Stage 2 -->
  <rect x="28" y="120" width="532" height="56" rx="9" fill="#0d1117" stroke="#ff7b72" stroke-opacity="0.65" stroke-width="1.2" />
  <rect x="28" y="120" width="4" height="56" rx="2" fill="#ff7b72" />
  <text x="46" y="144" class="sans title">2. Deny rules (session · project · global)</text>
  <text x="46" y="162" class="sans sub">A deny at any scope beats every allow rule and skips model review.</text>
  <line x1="560" y1="148" x2="700" y2="148" stroke="#ff7b72" stroke-width="1.4" marker-end="url(#right-red)" />
  <text x="630" y="140" text-anchor="middle" class="sans edge">Any deny match</text>
  <rect x="708" y="128" width="184" height="40" rx="8" fill="#2c161a" stroke="#ff7b72" stroke-opacity="0.7" stroke-width="1.1" />
  <text x="800" y="152" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ff7b72">Block (no prompt)</text>

  <line x1="294" y1="176" x2="294" y2="191" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#down)" />

  <!-- Stage 3 -->
  <rect x="28" y="194" width="532" height="56" rx="9" fill="#0d1117" stroke="#9d7cd8" stroke-opacity="0.7" stroke-width="1.2" />
  <rect x="28" y="194" width="4" height="56" rx="2" fill="#9d7cd8" />
  <text x="46" y="218" class="sans title">3. Workspace trust &amp; action safety</text>
  <text x="46" y="236" class="sans sub">Restricted checkouts block mutations; unsafe calls cannot use ordinary allows.</text>
  <line x1="560" y1="222" x2="700" y2="222" stroke="#ff7b72" stroke-width="1.4" marker-end="url(#right-red)" />
  <text x="630" y="214" text-anchor="middle" class="sans edge">Untrusted write</text>
  <rect x="708" y="202" width="184" height="40" rx="8" fill="#2c161a" stroke="#ff7b72" stroke-opacity="0.7" stroke-width="1.1" />
  <text x="800" y="226" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ff7b72">Block (restricted)</text>

  <line x1="294" y1="250" x2="294" y2="265" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#down)" />

  <!-- Stage 4 -->
  <rect x="28" y="268" width="532" height="56" rx="9" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="28" y="268" width="4" height="56" rx="2" fill="#3fb950" />
  <text x="46" y="292" class="sans title">4. Allow rules &amp; session mode baseline</text>
  <text x="46" y="310" class="sans sub">Eligible allow grant or mode baseline (e.g. safe reads, accept_edits writes).</text>
  <line x1="560" y1="296" x2="700" y2="296" stroke="#3fb950" stroke-width="1.4" marker-end="url(#right-green)" />
  <text x="630" y="288" text-anchor="middle" class="sans edge">Eligible match</text>
  <rect x="708" y="276" width="184" height="40" rx="8" fill="#163024" stroke="#3fb950" stroke-opacity="0.75" stroke-width="1.1" />
  <text x="800" y="300" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#7ee787">Run directly</text>

  <line x1="294" y1="324" x2="294" y2="339" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#down)" />

  <!-- Stage 5 -->
  <rect x="28" y="342" width="532" height="56" rx="9" fill="#161b22" stroke="#f0883e" stroke-opacity="0.8" stroke-width="1.3" />
  <rect x="28" y="342" width="4" height="56" rx="2" fill="#f0883e" />
  <text x="46" y="366" class="sans title">5. Remaining requests</text>
  <text x="46" y="384" class="sans sub">In auto mode, the one-shot reviewer evaluates first and may defer to you.</text>
  <line x1="560" y1="370" x2="700" y2="370" stroke="#f0883e" stroke-width="1.4" marker-end="url(#right-amber)" />
  <text x="630" y="362" text-anchor="middle" class="sans edge">Needs decision</text>
  <rect x="708" y="350" width="184" height="40" rx="8" fill="#2d1f14" stroke="#f0883e" stroke-opacity="0.8" stroke-width="1.1" />
  <text x="800" y="374" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#f0883e">Prompt / Auto review</text>
</svg>
