<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="Subagent delegation flow: Parent session calls invoke_agent to launch shared-directory or isolated git worktree subagents in parallel, receiving an async subagent_completed wakeup without polling">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .kicker { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #8b949e; }
      .title { font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .sub { font-size: 10.5px; fill: #9198a1; }
    </style>
    <marker id="d-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="d-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2ac3de" />
    </marker>
    <marker id="d-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9d7cd8" />
    </marker>
    <marker id="d-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="918" height="298" rx="14" fill="#0b0f14" stroke="#30363d" stroke-width="1.5" />
  <text x="28" y="32" class="sans kicker">ASYNC SUBAGENT DELEGATION</text>

  <!-- Parent Session -->
  <rect x="28" y="92" width="166" height="92" rx="10" fill="#161b22" stroke="#9d7cd8" stroke-opacity="0.85" stroke-width="1.4" />
  <rect x="28" y="92" width="166" height="4" rx="2" fill="#9d7cd8" />
  <text x="111" y="124" text-anchor="middle" class="sans title">Parent Session</text>
  <text x="111" y="144" text-anchor="middle" class="mono sub">main agent</text>
  <text x="111" y="164" text-anchor="middle" class="sans sub">Continues other work</text>

  <!-- Arrow Parent -> invoke_agent -->
  <line x1="194" y1="138" x2="226" y2="138" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#d-blue)" />

  <!-- invoke_agent -->
  <rect x="232" y="104" width="134" height="68" rx="9" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.75" stroke-width="1.2" />
  <text x="299" y="133" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#79c0ff">invoke_agent</text>
  <text x="299" y="153" text-anchor="middle" class="sans sub">Returns child ID</text>

  <!-- Fan-out connectors -->
  <path d="M 366 126 H 396 V 92 H 424" fill="none" stroke="#2ac3de" stroke-width="1.5" marker-end="url(#d-cyan)" />
  <path d="M 366 150 H 396 V 186 H 424" fill="none" stroke="#9d7cd8" stroke-width="1.5" marker-end="url(#d-purple)" />

  <!-- Child 1: Shared directory -->
  <rect x="430" y="54" width="218" height="76" rx="9" fill="#0d1117" stroke="#2ac3de" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="430" y="54" width="4" height="76" rx="2" fill="#2ac3de" />
  <text x="448" y="81" class="sans title">Shared-Directory Child</text>
  <text x="448" y="100" class="mono" font-size="10" fill="#2ac3de">workspace: "inherit"</text>
  <text x="448" y="117" class="sans sub">Research, reviews &amp; parallel reads</text>

  <!-- Child 2: Isolated Git worktree -->
  <rect x="430" y="148" width="218" height="76" rx="9" fill="#0d1117" stroke="#9d7cd8" stroke-opacity="0.75" stroke-width="1.2" />
  <rect x="430" y="148" width="4" height="76" rx="2" fill="#9d7cd8" />
  <text x="448" y="175" class="sans title">Git Worktree Child</text>
  <text x="448" y="194" class="mono" font-size="10" fill="#9d7cd8">workspace: "worktree"</text>
  <text x="448" y="211" class="sans sub">Isolated branch for parallel edits</text>

  <!-- Fan-in connectors -->
  <path d="M 648 92 H 678 V 138 H 706" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d-green)" />
  <path d="M 648 186 H 678 V 138" fill="none" stroke="#3fb950" stroke-width="1.5" />

  <!-- Async Wakeup -->
  <rect x="712" y="92" width="180" height="92" rx="10" fill="#163024" stroke="#3fb950" stroke-opacity="0.8" stroke-width="1.3" />
  <text x="802" y="122" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#7ee787">Async Wakeup</text>
  <text x="802" y="143" text-anchor="middle" class="mono" font-size="9.5" fill="#e6edf3">&lt;subagent_completed&gt;</text>
  <text x="802" y="164" text-anchor="middle" class="sans sub">Delivered automatically</text>

  <!-- Return arrow back to Parent -->
  <path d="M 802 184 V 260 H 111 V 190" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#d-green)" />
  <rect x="352" y="247" width="212" height="24" rx="6" fill="#0d1117" stroke="#262c36" stroke-width="1" />
  <text x="458" y="263" text-anchor="middle" class="sans" font-size="10.5" fill="#b1bac4">Synthesizes results · no polling loop</text>
</svg>
