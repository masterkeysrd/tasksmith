<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="TaskSmith architecture: Interactive TUI, Headless exec, and Editor via ACP connect over brain.sock HTTP and SSE to the Local Daemon, which runs tools in the OS Kernel Sandbox and calls Model Providers">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .kicker { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; fill: #8b949e; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #e6edf3; }
      .card-sub { font-size: 11px; fill: #9198a1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#f0883e" />
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="918" height="338" rx="14" fill="#0b0f14" stroke="#30363d" stroke-width="1.5" />

  <!-- Column headers -->
  <text x="28" y="34" class="sans kicker">CLIENTS</text>
  <text x="344" y="34" class="sans kicker">SHARED BACKGROUND SERVICE</text>
  <text x="664" y="34" class="sans kicker">EXECUTION &amp; MODELS</text>

  <!-- Left column: 3 client cards -->
  <!-- Interactive TUI -->
  <rect x="28" y="50" width="204" height="72" rx="9" fill="#0d1117" stroke="#2ac3de" stroke-opacity="0.65" stroke-width="1.2" />
  <rect x="28" y="50" width="4" height="72" rx="2" fill="#2ac3de" />
  <text x="46" y="79" class="sans card-title">Interactive TUI</text>
  <text x="46" y="100" class="mono card-sub">tasksmith</text>

  <!-- Headless exec -->
  <rect x="28" y="138" width="204" height="72" rx="9" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.65" stroke-width="1.2" />
  <rect x="28" y="138" width="4" height="72" rx="2" fill="#58a6ff" />
  <text x="46" y="167" class="sans card-title">Headless CLI &amp; CI</text>
  <text x="46" y="188" class="mono card-sub">tasksmith exec / -p</text>

  <!-- Editor via ACP -->
  <rect x="28" y="226" width="204" height="72" rx="9" fill="#0d1117" stroke="#1abc9c" stroke-opacity="0.65" stroke-width="1.2" />
  <rect x="28" y="226" width="4" height="72" rx="2" fill="#1abc9c" />
  <text x="46" y="255" class="sans card-title">Editor via ACP</text>
  <text x="46" y="276" class="mono card-sub">tasksmith acp</text>

  <!-- Converging connectors: Clients -> Daemon -->
  <path d="M 232 86 H 268 V 174 H 336" fill="none" stroke="#58a6ff" stroke-opacity="0.7" stroke-width="1.5" />
  <path d="M 232 174 H 336" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 232 262 H 268 V 174" fill="none" stroke="#58a6ff" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Transport pill -->
  <rect x="247" y="148" width="80" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="287" y="162" text-anchor="middle" class="mono" font-size="10" fill="#e6edf3">brain.sock</text>
  <text x="287" y="191" text-anchor="middle" class="mono" font-size="9.5" fill="#8b949e">HTTP + SSE</text>

  <!-- Center hub: Local Daemon -->
  <rect x="344" y="50" width="244" height="248" rx="11" fill="#121722" stroke="#9d7cd8" stroke-opacity="0.85" stroke-width="1.5" />
  <rect x="344" y="50" width="244" height="54" rx="11" fill="#161b22" />
  <rect x="344" y="92" width="244" height="12" fill="#161b22" />
  <line x1="344" y1="104" x2="588" y2="104" stroke="#262c36" stroke-width="1" />
  <!-- Mini TaskSmith brand mark -->
  <rect x="360" y="64" width="18" height="5" rx="1" fill="#2ac3de" />
  <rect x="365.5" y="71" width="7" height="5" rx="1" fill="#1abc9c" />
  <rect x="362.5" y="78" width="13" height="5" rx="1" fill="#ff5f5f" />
  <text x="388" y="75" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Local Daemon</text>
  <text x="388" y="92" class="mono" font-size="10.5" fill="#9d7cd8">tasksmith daemon serve</text>

  <!-- Internal daemon responsibilities -->
  <rect x="360" y="118" width="212" height="46" rx="7" fill="#0d1117" stroke="#262c36" stroke-width="1" />
  <text x="374" y="138" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">Agent Harness &amp; Tools</text>
  <text x="374" y="154" class="sans" font-size="10.5" fill="#9198a1">Turns, subagents, MCP &amp; skills</text>

  <rect x="360" y="176" width="212" height="46" rx="7" fill="#0d1117" stroke="#262c36" stroke-width="1" />
  <text x="374" y="196" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">Permissions &amp; Trust</text>
  <text x="374" y="212" class="sans" font-size="10.5" fill="#9198a1">Rules, shellguard &amp; auto review</text>

  <rect x="360" y="234" width="212" height="46" rx="7" fill="#0d1117" stroke="#262c36" stroke-width="1" />
  <text x="374" y="254" class="sans" font-size="12.5" font-weight="600" fill="#e6edf3">SQLite Turn Journal</text>
  <text x="374" y="270" class="sans" font-size="10.5" fill="#9198a1">Sessions survive terminal close</text>

  <!-- Diverging connectors: Daemon -> Sandbox & Providers -->
  <path d="M 588 148 H 628 V 106 H 660" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 588 200 H 628 V 242 H 660" fill="none" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- Right column: Execution & Providers -->
  <!-- OS Sandbox -->
  <rect x="664" y="50" width="232" height="112" rx="9" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.7" stroke-width="1.2" />
  <rect x="664" y="50" width="4" height="112" rx="2" fill="#3fb950" />
  <text x="682" y="79" class="sans card-title">OS Kernel Sandbox</text>
  <text x="682" y="100" class="sans card-sub">Confines shell &amp; file execution</text>
  <rect x="680" y="114" width="200" height="32" rx="6" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="780" y="134" text-anchor="middle" class="mono" font-size="9.5" fill="#7ee787">Seatbelt · Bubblewrap · Proxy</text>

  <!-- Model Providers -->
  <rect x="664" y="186" width="232" height="112" rx="9" fill="#0d1117" stroke="#f0883e" stroke-opacity="0.7" stroke-width="1.2" />
  <rect x="664" y="186" width="4" height="112" rx="2" fill="#f0883e" />
  <text x="682" y="215" class="sans card-title">Model Providers</text>
  <text x="682" y="236" class="sans card-sub">Role routing &amp; quota tracking</text>
  <rect x="680" y="250" width="200" height="32" rx="6" fill="#161b22" stroke="#262c36" stroke-width="1" />
  <text x="780" y="270" text-anchor="middle" class="mono" font-size="9.5" fill="#f0883e">Anthropic · OpenAI · Ollama</text>
</svg>
