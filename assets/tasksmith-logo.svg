<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 1:1 Square Background -->
  <rect width="256" height="256" rx="48" fill="#16161e" />

  <!-- Block 1 (◥████████◤): Widened symmetrical top bar, x=32..224 (192px), y=48..92 -->
  <g fill="#2ac3de">
    <polygon points="32,56 52,56 52,76" />
    <rect x="52" y="48" width="152" height="44" />
    <polygon points="204,56 224,56 204,76" />
  </g>

  <!-- Block 2 (▐██▌): Center Pillar, x=100..156 (56px), y=106..150 -->
  <g fill="#1abc9c">
    <rect x="100" y="106" width="56" height="44" />
  </g>

  <!-- Block 3 (◢████◣): Symmetrical bottom wings, x=68..188 (120px), y=164..208 -->
  <g fill="#ff5f5f">
    <polygon points="68,200 88,180 88,200" />
    <rect x="88" y="164" width="80" height="44" />
    <polygon points="168,180 188,200 168,200" />
  </g>
</svg>